openapi: 3.0.3
info:
  title: KPI Organization and Authorization Foundation API
  version: 1.0.0
  description: >-
    Reference contract for bootstrap provisioning/recovery, organization
    structure, approved baselines, atomic capabilities, custom roles, scoped
    assignments, delegation, approval, and audit. All writes are authorized
    again by the Application layer.
servers:
  - url: /api/v1
tags:
  - name: Platform Bootstrap
  - name: Organization Structure
  - name: Security
  - name: Approval
  - name: Audit
paths:
  /platform/organizations:
    post:
      tags: [Platform Bootstrap]
      operationId: provisionOrganization
      summary: Atomically provision an Organization and two distinct temporary Bootstrap Principals.
      description: >-
        Requires host capability platform.organization.provision. The request
        cannot choose bootstrap capabilities; the product-fixed profile is used.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProvisionOrganizationRequest' }
      responses:
        '201':
          description: Complete atomic provisioning result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapProvisioningView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /platform/organizations/{organizationId}/bootstrap:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Platform Bootstrap]
      operationId: getBootstrapProvisioning
      summary: Read bootstrap principal and handoff status through platform scope.
      responses:
        '200':
          description: Current status plus immutable provisioning/handoff evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapProvisioningView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform/organizations/{organizationId}/bootstrap-recovery-requests:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Platform Bootstrap]
      operationId: requestBootstrapRecovery
      summary: Request time-bounded replacement of exactly one unavailable Bootstrap Principal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBootstrapRecoveryRequest' }
      responses:
        '201':
          description: Pending recovery request; no authority has changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapRecoveryRequestView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /platform/organizations/{organizationId}/bootstrap-recovery-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Platform Bootstrap]
      operationId: getBootstrapRecoveryRequest
      responses:
        '200':
          description: Immutable decisions and derived request status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapRecoveryRequestView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform/organizations/{organizationId}/bootstrap-recovery-requests/{requestId}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Platform Bootstrap]
      operationId: decideBootstrapRecovery
      summary: Record one Platform Security Administrator decision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapRecoveryDecisionRequest' }
      responses:
        '200':
          description: Updated derived request status; application occurs only on the second valid independent approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapRecoveryRequestView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /capabilities:
    get:
      tags: [Security]
      operationId: listKpiCapabilities
      summary: List the fixed product capability catalog grouped by business task.
      responses:
        '200':
          description: Fixed catalog visible within the actor's administrative scope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityDefinition'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationId}/structure/workspace:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organization Structure]
      operationId: getStructureWorkspace
      responses:
        '200':
          description: Current editable structure workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructureWorkspace'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Organization Structure]
      operationId: saveStructureWorkspace
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStructureWorkspaceRequest'
      responses:
        '200':
          description: Accepted new workspace revision.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructureWorkspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/structure/workspace/validate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Organization Structure]
      operationId: validateStructureWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, format: int64 }
      responses:
        '200':
          description: Complete deterministic validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /organizations/{organizationId}/structure/workspace/submit:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Organization Structure]
      operationId: submitStructureRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitStructureRequest'
      responses:
        '201':
          description: >-
            Frozen submitted revision plus immutable approval evidence. The first
            baseline uses fixed bootstrap evidence; later submissions may use an
            Approval Route snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedStructureRevision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/structure/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: revisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Organization Structure]
      operationId: getStructureRevision
      responses:
        '200':
          description: Immutable submitted revision with review evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmittedStructureRevision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/structure/revisions/{revisionId}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: revisionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Organization Structure, Approval]
      operationId: decideStructureRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Immutable review decision and approved baseline when approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/baselines/effective:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: at
        in: query
        required: true
        schema: { type: string, format: date-time }
    get:
      tags: [Organization Structure]
      operationId: getEffectiveBaseline
      responses:
        '200':
          description: The only approved baseline applicable at the requested instant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/baseline-eligibility:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: operationKind
        in: query
        required: true
        schema: { $ref: '#/components/schemas/BaselineDependentOperationKind' }
      - name: at
        in: query
        required: true
        schema: { type: string, format: date-time }
    get:
      tags: [Organization Structure]
      operationId: getBaselineEligibility
      description: >-
        Executable foundation decision used to verify the gate matrix. Later
        business commands consume the same Application interface directly.
      responses:
        '200':
          description: Stable allow or deny decision with applicable baseline evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineEligibilityDecision'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationId}/organization-tree:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: effectiveAt
        in: query
        required: true
        schema: { type: string, format: date-time }
      - name: baselineId
        in: query
        schema: { type: string, format: uuid }
      - name: parentUnitId
        in: query
        schema: { type: string, format: uuid }
      - name: positionId
        in: query
        schema: { type: string, format: uuid }
      - name: search
        in: query
        schema: { type: string, maxLength: 200 }
      - name: continuationToken
        in: query
        schema: { type: string }
    get:
      tags: [Organization Structure]
      operationId: getAuthorizedOrganizationTree
      description: >-
        Returns approved-baseline Unit and Position nodes filtered by effective
        capability and KPI Data Scope. Unit nodes are navigation branches;
        Position nodes are selectable workspace context. This foundation read
        does not return KPI Plan, Target, Actual, Variance, or score facts.
      responses:
        '200':
          description: Authorized lazy tree branch and exact baseline applicability context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTreeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/baseline-impacts:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: status
        in: query
        schema:
          type: string
          enum: [detected, resolved]
    get:
      tags: [Organization Structure]
      operationId: listBaselineChangeImpacts
      responses:
        '200':
          description: >-
            Immutable baseline impacts and derived resolution status within the
            actor's data scope. Resolution is registered only through the
            in-process Planning contract, not this HTTP API.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaselineChangeImpact'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationId}/recascade-previews:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Organization Structure]
      operationId: previewProportionalRecascade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecascadePreviewRequest'
      responses:
        '200':
          description: Deterministic preview; no KPI Plan is mutated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecascadePreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/security-policy:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Security]
      operationId: getOrganizationSecurityPolicy
      responses:
        '200':
          description: System floor, Organization override, and effective policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicyView'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Security]
      operationId: updateOrganizationSecurityPolicy
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityPolicyRequest'
      responses:
        '200':
          description: Stricter Organization policy accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicyView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-groups:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Approval]
      operationId: listApprovalGroups
      responses:
        '200':
          description: Internal approval groups visible in the actor's scope.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalGroupView' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Approval]
      operationId: createApprovalGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApprovalGroupRequest' }
      responses:
        '201':
          description: Organization-scoped internal Approval Group created.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupView' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Approval]
      operationId: getApprovalGroup
      responses:
        '200':
          description: Approval Group head and effective-dated membership history.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupView' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/approval-groups/{groupId}/memberships:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Approval]
      operationId: addApprovalGroupMembership
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApprovalGroupMembershipRequest' }
      responses:
        '201':
          description: Effective-dated immutable membership created.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupView' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-groups/{groupId}/memberships/{membershipId}/end:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [Approval]
      operationId: endApprovalGroupMembership
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndApprovalGroupMembershipRequest' }
      responses:
        '200':
          description: Membership end recorded without rewriting its effective start.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupView' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-groups/{groupId}/retire:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Approval]
      operationId: retireApprovalGroup
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Group retired for new route resolutions; prior snapshots remain unchanged.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalGroupView' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-routes:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Approval]
      operationId: listApprovalRoutes
      responses:
        '200':
          description: Versioned route definitions visible in the actor's scope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalRouteView'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Approval]
      operationId: createApprovalRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRouteRequest'
      responses:
        '201':
          description: Route head and immutable draft version created.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRouteView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-routes/{routeId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RouteId'
    get:
      tags: [Approval]
      operationId: getApprovalRoute
      responses:
        '200':
          description: Route head and immutable version history.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRouteView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/approval-routes/{routeId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RouteId'
    post:
      tags: [Approval]
      operationId: createApprovalRouteVersion
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRouteVersionRequest'
      responses:
        '201':
          description: New immutable draft route version; stale heads cannot branch.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRouteVersionView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-routes/{routeId}/versions/{versionId}/validate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Approval]
      operationId: validateApprovalRouteVersion
      responses:
        '200':
          description: Deterministic selector/stage validation without approval or activation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /organizations/{organizationId}/approval-routes/{routeId}/versions/{versionId}/submit:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Approval]
      operationId: submitApprovalRouteVersion
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Route version content frozen and submitted for independent review.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRouteVersionView' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-routes/{routeId}/versions/{versionId}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Approval]
      operationId: decideApprovalRouteVersion
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Immutable independent review decision; approval does not bypass activation.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRouteVersionDecisionResponse' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-routes/{routeId}/versions/{versionId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [Approval]
      operationId: activateApprovalRouteVersion
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateApprovalRouteVersionRequest'
      responses:
        '200':
          description: >-
            Independently approved target becomes active and any prior active
            version/route is retired atomically through the artifact-type slot.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRouteActivationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-routes/{routeId}/retire:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RouteId'
    post:
      tags: [Approval]
      operationId: retireApprovalRoute
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Non-active route retired; historical snapshots remain valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRouteView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-route-snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/SnapshotId'
    get:
      tags: [Approval, Audit]
      operationId: getApprovalRouteSnapshot
      responses:
        '200':
          description: Scope-filtered immutable selector and candidate evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRouteSnapshotView' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/custom-roles:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Security]
      operationId: createCustomKpiRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomRoleRequest'
      responses:
        '201':
          description: Role and immutable first version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoleView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/custom-roles/{roleId}/versions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: roleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Security]
      operationId: createCustomKpiRoleVersion
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomRoleVersionRequest'
      responses:
        '201':
          description: New immutable capability bundle version.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomRoleVersionView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/role-assignments:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Security]
      operationId: createRoleAssignmentProposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleAssignmentRequest'
      responses:
        '201':
          description: Proposal with privilege preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/role-assignments/{assignmentId}/submit:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Security, Approval]
      operationId: submitRoleAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, reason]
              properties:
                expectedRevision: { type: integer, format: int64 }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Assignment is pending approval or scheduled when low risk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/role-assignments/{assignmentId}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AssignmentId'
    post:
      tags: [Security, Approval]
      operationId: decideRoleAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Independent immutable assignment decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-delegations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Approval]
      operationId: createApprovalDelegation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDelegationRequest'
      responses:
        '201':
          description: Governed delegation proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-delegations/{delegationId}/decisions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: delegationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Approval]
      operationId: decideApprovalDelegation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Immutable delegation approval or rejection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /organizations/{organizationId}/approval-timelines/{artifactType}/{artifactId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: artifactType
        in: path
        required: true
        schema: { type: string }
      - name: artifactId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Audit, Approval]
      operationId: getApprovalTimeline
      responses:
        '200':
          description: Scope-filtered explainable timeline.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/me/actions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - name: resourceType
        in: query
        required: true
        schema: { type: string }
      - name: resourceId
        in: query
        schema: { type: string, format: uuid }
    get:
      tags: [Security]
      operationId: getMyAvailableActions
      description: Usability projection only; command authorization remains authoritative.
      responses:
        '200':
          description: Reduced list of currently available atomic actions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      name: routeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed transport request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Missing capability, scope, effective authority, or separation of duty.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Resource is absent or not safely visible in the actor's Organization scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: >-
        Stale revision/head/activation slot, invalid lifecycle transition, or
        database-protected concurrent conflict.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unprocessable:
      description: Domain validation, missing baseline/approver, or protected policy violation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProvisionOrganizationRequest:
      type: object
      additionalProperties: false
      required: [code, name, timeZoneId, setupSubjectId, independentApprovalSubjectId]
      properties:
        code: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 300 }
        timeZoneId: { type: string, minLength: 1, maxLength: 100 }
        setupSubjectId: { type: string, minLength: 1, maxLength: 300 }
        independentApprovalSubjectId: { type: string, minLength: 1, maxLength: 300 }

    BootstrapPrincipalDuty:
      type: string
      enum: [setup, independentApproval]

    BootstrapPrincipalView:
      type: object
      additionalProperties: false
      required: [id, organizationId, duty, subjectId, grantProfileVersion, status, provisionedAt]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        duty: { $ref: '#/components/schemas/BootstrapPrincipalDuty' }
        subjectId: { type: string }
        grantProfileVersion: { type: string }
        status: { type: string, enum: [active, replaced, expired] }
        provisionedAt: { type: string, format: date-time }
        replacedByPrincipalId: { type: string, format: uuid, nullable: true }
        replacementRoleAssignmentId: { type: string, format: uuid, nullable: true }
        expiredAt: { type: string, format: date-time, nullable: true }

    BootstrapHandoffView:
      type: object
      additionalProperties: false
      required: [id, organizationId, setupReplacementRoleAssignmentId, approvalReplacementRoleAssignmentId, completedAt, contentHash]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        setupReplacementRoleAssignmentId: { type: string, format: uuid }
        approvalReplacementRoleAssignmentId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        contentHash: { type: string }

    BootstrapProvisioningView:
      type: object
      additionalProperties: false
      required: [organizationId, organizationCode, organizationName, timeZoneId, bootstrapPrincipals, bootstrapStatus, provisionedAt]
      properties:
        organizationId: { type: string, format: uuid }
        organizationCode: { type: string }
        organizationName: { type: string }
        timeZoneId: { type: string }
        bootstrapPrincipals:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/BootstrapPrincipalView' }
        bootstrapStatus: { type: string, enum: [active, handedOff] }
        handoff: { $ref: '#/components/schemas/BootstrapHandoffView', nullable: true }
        provisionedAt: { type: string, format: date-time }

    CreateBootstrapRecoveryRequest:
      type: object
      additionalProperties: false
      required: [unavailablePrincipalId, replacementSubjectId, reason, expiresAt]
      properties:
        unavailablePrincipalId: { type: string, format: uuid }
        replacementSubjectId: { type: string, minLength: 1, maxLength: 300 }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expiresAt: { type: string, format: date-time }

    BootstrapRecoveryDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    BootstrapRecoveryDecisionView:
      type: object
      additionalProperties: false
      required: [id, requestId, platformAdministratorSubjectId, decision, reason, occurredAt, correlationId]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        platformAdministratorSubjectId: { type: string }
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }

    BootstrapRecoveryRequestView:
      type: object
      additionalProperties: false
      required: [id, organizationId, unavailablePrincipalId, replacementSubjectId, reason, requestedBySubjectId, requestedAt, expiresAt, status, decisions]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        unavailablePrincipalId: { type: string, format: uuid }
        replacementSubjectId: { type: string }
        reason: { type: string }
        requestedBySubjectId: { type: string }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, rejected, expired, applied] }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/BootstrapRecoveryDecisionView' }
        appliedPrincipalId: { type: string, format: uuid, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }

    EffectiveInterval:
      type: object
      required: [from]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, nullable: true }

    CapabilityDefinition:
      type: object
      required: [id, businessArea, displayName, description, risk, allowedScopes, conflictsWith]
      properties:
        id: { type: string, example: organization.baseline.approve }
        businessArea: { type: string }
        displayName: { type: string }
        description: { type: string }
        risk: { type: string, enum: [low, medium, high, critical] }
        allowedScopes:
          type: array
          items: { $ref: '#/components/schemas/ScopeKind' }
        conflictsWith:
          type: array
          items: { type: string }

    ScopeKind:
      type: string
      enum: [organization, unitSubtree, assigned, self]

    KpiDataScope:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ScopeKind' }
        baselineId: { type: string, format: uuid, nullable: true }
        organizationUnitId: { type: string, format: uuid, nullable: true }
        responsibilityType: { type: string, nullable: true }
        responsibilitySubjectId: { type: string, format: uuid, nullable: true }
        employeeId: { type: string, format: uuid, nullable: true }

    StructureWorkspace:
      type: object
      required: [id, organizationId, revision, concurrencyToken, document]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        concurrencyToken: { type: string }
        document: { $ref: '#/components/schemas/StructureDocument' }

    SaveStructureWorkspaceRequest:
      type: object
      required: [expectedRevision, document]
      properties:
        expectedRevision: { type: integer, format: int64 }
        document: { $ref: '#/components/schemas/StructureDocument' }

    StructureDocument:
      type: object
      required: [units, positions, employees, positionAssignments, reportingRelationships, scopedRoleAssignmentIds]
      properties:
        units:
          type: array
          items: { $ref: '#/components/schemas/OrganizationUnit' }
        positions:
          type: array
          items: { $ref: '#/components/schemas/Position' }
        employees:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        positionAssignments:
          type: array
          items: { $ref: '#/components/schemas/PositionAssignment' }
        reportingRelationships:
          type: array
          items: { $ref: '#/components/schemas/ReportingRelationship' }
        scopedRoleAssignmentIds:
          type: array
          items: { type: string, format: uuid }

    OrganizationUnit:
      type: object
      required: [id, code, name, unitType, status, effectiveInterval]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        unitType: { type: string }
        parentUnitId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }

    Position:
      type: object
      required: [id, code, name, organizationUnitId, status, effectiveInterval]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        organizationUnitId: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }

    Employee:
      type: object
      required: [id, employeeNumber, displayName, employmentStatus, employmentInterval, accountStatus]
      properties:
        id: { type: string, format: uuid }
        employeeNumber: { type: string }
        displayName: { type: string }
        employmentStatus: { type: string, enum: [pending, active, leave, ended] }
        employmentInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        accountSubjectId: { type: string, nullable: true }
        accountStatus: { type: string, enum: [unlinked, enabled, disabled] }

    PositionAssignment:
      type: object
      required: [id, employeeId, positionId, effectiveInterval, isPrimary, allocationPercent]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        positionId: { type: string, format: uuid }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        isPrimary: { type: boolean }
        allocationPercent: { type: string, pattern: '^([0-9]+)(\\.[0-9]+)?$' }

    ReportingRelationship:
      type: object
      required: [id, subordinatePositionId, managerPositionId, relationshipType, effectiveInterval]
      properties:
        id: { type: string, format: uuid }
        subordinatePositionId: { type: string, format: uuid }
        managerPositionId: { type: string, format: uuid }
        relationshipType: { type: string, enum: [direct, solidLine, dottedLine] }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }

    ValidationResult:
      type: object
      required: [isValid, diagnostics]
      properties:
        isValid: { type: boolean }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/Diagnostic' }

    Diagnostic:
      type: object
      required: [code, message, path]
      properties:
        code: { type: string }
        message: { type: string }
        path:
          type: array
          items: { type: string }
        conflictingIds:
          type: array
          items: { type: string, format: uuid }

    SubmitStructureRequest:
      type: object
      required: [expectedRevision, effectiveFrom, reason]
      properties:
        expectedRevision: { type: integer, format: int64 }
        effectiveFrom: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    SubmittedStructureRevision:
      type: object
      required: [id, organizationId, revisionNumber, status, contentHash, effectiveFrom, approvalMode, approvalEvidenceId]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        revisionNumber: { type: integer, format: int64 }
        status: { type: string, enum: [submitted, approved, rejected, superseded] }
        contentHash: { type: string }
        effectiveFrom: { type: string, format: date-time }
        approvalMode: { type: string, enum: [bootstrap, approvalRoute] }
        approvalEvidenceId: { type: string, format: uuid }
        routeSnapshotId:
          type: string
          format: uuid
          nullable: true
          description: Present only when approvalMode is approvalRoute.
        baseline: { $ref: '#/components/schemas/BaselineSummary' }

    BaselineSummary:
      type: object
      required: [id, organizationId, structureRevisionId, effectiveInterval, status, contentHash]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        structureRevisionId: { type: string, format: uuid }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }
        status: { type: string, enum: [scheduled, effective, superseded] }
        contentHash: { type: string }
        previousBaselineId: { type: string, format: uuid, nullable: true }

    BaselineApplicabilitySegmentSummary:
      type: object
      required: [id, baselineId, effectiveInterval]
      properties:
        id: { type: string, format: uuid }
        baselineId: { type: string, format: uuid }
        effectiveInterval: { $ref: '#/components/schemas/EffectiveInterval' }

    OrganizationTreeNode:
      oneOf:
        - $ref: '#/components/schemas/OrganizationUnitTreeNode'
        - $ref: '#/components/schemas/PositionTreeNode'
      discriminator:
        propertyName: kind
        mapping:
          organizationUnit: '#/components/schemas/OrganizationUnitTreeNode'
          position: '#/components/schemas/PositionTreeNode'

    OrganizationUnitTreeNode:
      type: object
      additionalProperties: false
      required: [kind, id, code, name, pathIds, hasChildren, allowedActions]
      properties:
        kind: { type: string, enum: [organizationUnit] }
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        unitType: { type: string }
        parentUnitId: { type: string, format: uuid, nullable: true }
        pathIds: { type: array, items: { type: string, format: uuid } }
        hasChildren: { type: boolean }
        allowedActions: { type: array, uniqueItems: true, items: { type: string } }

    PositionTreeNode:
      type: object
      additionalProperties: false
      required: [kind, id, code, name, organizationUnitId, holderCount, allowedActions]
      properties:
        kind: { type: string, enum: [position] }
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        organizationUnitId: { type: string, format: uuid }
        holderCount: { type: integer, minimum: 0 }
        allowedActions: { type: array, uniqueItems: true, items: { type: string } }

    OrganizationTreeResponse:
      type: object
      required: [organizationId, effectiveAt, baseline, baselineApplicabilitySegment, nodes]
      properties:
        organizationId: { type: string, format: uuid }
        effectiveAt: { type: string, format: date-time }
        baseline: { $ref: '#/components/schemas/BaselineSummary' }
        baselineApplicabilitySegment: { $ref: '#/components/schemas/BaselineApplicabilitySegmentSummary' }
        parentUnitId: { type: string, format: uuid, nullable: true }
        selectedPositionId: { type: string, format: uuid, nullable: true }
        nodes:
